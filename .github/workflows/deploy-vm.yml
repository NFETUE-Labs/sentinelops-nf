name: Deploy To Droplet VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-vm
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: docker compose -f docker-compose.yml config >/dev/null

  deploy:
    name: Deploy Over SSH
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          if [ -z "$DO_HOST" ]; then
            echo "DO_HOST is missing"
            exit 1
          fi
          if [ -z "$DO_SSH_KEY" ]; then
            echo "DO_SSH_KEY is missing"
            exit 1
          fi

      - name: Upload code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "."
          target: "/root/sentinelops-nf"
          rm: true
          overwrite: true
          strip_components: 0
          tar_tmp_path: "/tmp"
          timeout: 120s

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          command_timeout: 90m
          script: |
            set -euo pipefail
            cd /root/sentinelops-nf
            docker compose build
            docker compose up -d --remove-orphans
            docker compose ps
