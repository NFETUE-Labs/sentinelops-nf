name: Deploy To Droplet VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-vm
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: docker compose -f docker-compose.yml config >/dev/null

  deploy:
    name: Deploy Over SSH
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate deployment secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          if [ -z "$DO_HOST" ]; then
            echo "DO_HOST is missing"
            exit 1
          fi
          if [ -z "$DO_SSH_KEY" ]; then
            echo "DO_SSH_KEY is missing"
            exit 1
          fi

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "[deploy] Entering project directory"
            cd /root/sentinelops-nf
            echo "[deploy] Syncing repository"
            git fetch origin main
            git checkout main
            dirty_status="$(git status --porcelain || true)"
            if [ -n "$dirty_status" ]; then
              echo "Local changes detected on VM, creating auto-stash"
              git stash push -u -m "ci-auto-stash-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git pull --ff-only origin main
            echo "[deploy] Ensuring SDK source is present"
            if [ -d sentinelops-sdk/.git ]; then
              echo "Updating local SDK mirror"
              git -C sentinelops-sdk fetch origin main
              git -C sentinelops-sdk checkout main
              git -C sentinelops-sdk pull --ff-only origin main
            elif [ -e sentinelops-sdk ] && [ ! -d sentinelops-sdk ]; then
              echo "sentinelops-sdk exists but is not a directory"
              exit 1
            elif [ -d sentinelops-sdk ]; then
              echo "sentinelops-sdk exists but is not a git repo; keeping it as-is"
            else
              echo "Cloning SDK repository"
              git clone https://github.com/NFETUE-Labs/sentinelops-python-sdk.git sentinelops-sdk
            fi
            echo "[deploy] Rebuilding and restarting containers"
            docker compose up --build -d --remove-orphans
