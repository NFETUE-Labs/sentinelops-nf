name: Deploy To Droplet VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-vm
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: docker compose -f docker-compose.yml config >/dev/null

  deploy:
    name: Deploy Over SSH
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate deployment secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          if [ -z "$DO_HOST" ]; then
            echo "DO_HOST is missing"
            exit 1
          fi
          if [ -z "$DO_SSH_KEY" ]; then
            echo "DO_SSH_KEY is missing"
            exit 1
          fi

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          command_timeout: 90m
          script: |
            set -e
            echo "[deploy] Entering project directory"
            cd /root/sentinelops-nf
            echo "[deploy] Syncing repository"
            n=0
            until [ "$n" -ge 5 ]; do
              git fetch origin main && break
              n=$((n+1))
              echo "[deploy] git fetch failed, retry $n/5"
              sleep 8
            done
            if [ "$n" -ge 5 ]; then
              echo "[deploy] git fetch failed after retries"
              exit 1
            fi
            git checkout main
            dirty_status="$(git status --porcelain || true)"
            if [ -n "$dirty_status" ]; then
              echo "Local changes detected on VM, creating auto-stash"
              git stash push -u -m "ci-auto-stash-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            n=0
            until [ "$n" -ge 5 ]; do
              git pull --ff-only origin main && break
              n=$((n+1))
              echo "[deploy] git pull failed, retry $n/5"
              sleep 8
            done
            if [ "$n" -ge 5 ]; then
              echo "[deploy] git pull failed after retries"
              exit 1
            fi
            echo "[deploy] Building images"
            docker compose build
            echo "[deploy] Restarting services"
            docker compose up -d --remove-orphans
            echo "[deploy] Services status"
            docker compose ps
